schemaVersion: 2.2.0
metadata:
  name: nodejs-hello-world
  version: 1.0.0
components:
  - name: runtime
    container: 
      image: registry.access.redhat.com/ubi9/nodejs-20:latest
      memoryLimit: 1G
      mountSources: true
      command: ['tail', '-f', '/dev/null']
      endpoints:
        - name: web
          targetPort: 8080
          exposure: public
          protocol: https
          secure: true 

commands:
  - id: install-dependencies
    exec:
      component: runtime
      commandLine: npm install
      # IMPORTANT: Replace '<your-repo-name>' with the exact name of your Git repository
      workingDir: ${PROJECTS_ROOT}/hello-world-node-js-code-assistant
      
  - id: start-app
    exec:
      component: runtime
      commandLine: npm start
      # IMPORTANT: Replace '<your-repo-name>' with the exact name of your Git repository
      workingDir: ${PROJECTS_ROOT}/hello-world-node-js-code-assistant
      group:
        kind: run
        isDefault: true

events:
  postStart:
    # Only run short-lived, terminating scripts in postStart
    - install-dependencies
