schemaVersion: 2.2.0
metadata:
  name: nodejs-hello-world
  version: 1.0.0
components:
  - name: runtime
    # The v2 schema requires the 'container' mapping here, rather than 'type: container'
    container: 
      image: registry.access.redhat.com/ubi9/nodejs-20:latest
      memoryLimit: 1G
      mountSources: true
      command: ['tail', '-f', '/dev/null']
      endpoints:
        - name: web
          targetPort: 8080
          exposure: public
          protocol: https
          # Enforces TLS/HTTPS on the OpenShift Route
          secure: true 

commands:
  - id: install-dependencies
    exec:
      component: runtime
      commandLine: npm install
      workingDir: ${PROJECTS_ROOT}
      
  - id: start-app
    exec:
      component: runtime
      commandLine: npm start
      workingDir: ${PROJECTS_ROOT}
      group:
        kind: run
        isDefault: true

events:
  postStart:
    - install-dependencies
    - start-app
