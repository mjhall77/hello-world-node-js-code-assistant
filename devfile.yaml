schemaVersion: 2.2.0
metadata:
  name: nodejs-hello-world
  version: 1.0.0

components:
  # 1. Instructs Dev Spaces to install the Continue extension natively
  - name: continue-ai
    plugin:
      id: Continue.continue
      registryUrl: https://open-vsx.org

  # 2. Your Node.js runtime (cleaner, without the curl hacks)
  - name: runtime
    container: 
      image: registry.access.redhat.com/ubi9/nodejs-20:latest
      memoryLimit: 1G
      mountSources: true
      command: ['tail', '-f', '/dev/null']
      endpoints:
        - name: web
          targetPort: 8080
          exposure: public
          protocol: https
          secure: true 

commands:
  - id: install-dependencies
    exec:
      component: runtime
      commandLine: npm install
      workingDir: ${PROJECTS_ROOT}/hello-world-node-js-code-assistant
      
  - id: start-app
    exec:
      component: runtime
      commandLine: npm start
      workingDir: ${PROJECTS_ROOT}/hello-world-node-js-code-assistant
      group:
        kind: run
        isDefault: true

events:
  postStart:
    - install-dependencies
