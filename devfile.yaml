schemaVersion: 2.2.0
metadata:
  name: nodejs-hello-world
  version: 1.0.0

components:
  - name: runtime
    container: 
      image: registry.access.redhat.com/ubi9/nodejs-20:latest
      memoryLimit: 1G
      mountSources: true
      command: ['tail', '-f', '/dev/null']
      env:
        # Instructs the hidden IDE container to install the downloaded .vsix
        - name: DEFAULT_EXTENSIONS
          value: /projects/continue.vsix
      endpoints:
        - name: web
          targetPort: 8080
          exposure: public
          protocol: https
          secure: true 

commands:
  - id: install-dependencies
    exec:
      component: runtime
      commandLine: npm install
      workingDir: ${PROJECTS_ROOT}/hello-world-node-js-code-assistant
      
  - id: start-app
    exec:
      component: runtime
      commandLine: npm start
      workingDir: ${PROJECTS_ROOT}/hello-world-node-js-code-assistant
      group:
        kind: run
        isDefault: true

  - id: download-and-configure-continue
    exec:
      component: runtime
      commandLine: |
        # 1. Download the extension to the shared volume, bypassing Git LFS issues
        curl -sSL "https://open-vsx.org/api/Continue/continue/linux-x64/download" -o /projects/continue.vsix
        
        # 2. Inject the custom vLLM settings
        mkdir -p ~/.continue
        cat << 'EOF' > ~/.continue/config.ts
        export default {
          models: [
            {
              "title": "In-Cluster vLLM Coder",
              "provider": "openai",
              "model": "vllm-cpu",
              "apiBase": "http://vllm-service.vllm-cpu.svc.cluster.local:8000/v1"
            }
          ],
          tabAutocompleteModel: {
            "title": "In-Cluster vLLM Autocomplete",
            "provider": "openai",
            "model": "vllm-cpu",
            "apiBase": "http://vllm-service.vllm-cpu.svc.cluster.local:8000/v1"
          }
        };
        EOF
      workingDir: ${PROJECTS_ROOT}

events:
  postStart:
    # Execute the download, configuration, and npm install sequentially
    - download-and-configure-continue
    - install-dependencies
