schemaVersion: 2.2.0
metadata:
  name: nodejs-hello-world
  version: 1.0.0

components:
  - name: runtime
    container: 
      image: registry.access.redhat.com/ubi9/nodejs-20:latest
      memoryLimit: 1G
      mountSources: true
      command: ['tail', '-f', '/dev/null']
      endpoints:
        - name: web
          targetPort: 8080
          exposure: public
          protocol: https
          secure: true 

commands:
  - id: install-dependencies
    exec:
      component: runtime
      commandLine: npm install
      workingDir: ${PROJECTS_ROOT}/hello-world-node-js-code-assistant
      
  - id: start-app
    exec:
      component: runtime
      commandLine: npm start
      workingDir: ${PROJECTS_ROOT}/hello-world-node-js-code-assistant
      group:
        kind: run
        isDefault: true

  # Inject the TypeScript configuration before the IDE loads
  - id: configure-continue
    exec:
      component: runtime
      commandLine: |
        mkdir -p ~/.continue
        cat << 'EOF' > ~/.continue/config.ts
        export default {
          models: [
            {
              "title": "In-Cluster vLLM Coder",
              "provider": "openai",
              "model": "vllm-cpu",
              "apiBase": "http://vllm-service.vllm-cpu.svc.cluster.local:8000/v1"
            }
          ],
          tabAutocompleteModel: {
            "title": "In-Cluster vLLM Autocomplete",
            "provider": "openai",
            "model": "vllm-cpu",
            "apiBase": "http://vllm-service.vllm-cpu.svc.cluster.local:8000/v1"
          }
        };
        EOF
      workingDir: ${PROJECTS_ROOT}

events:
  postStart:
    - configure-continue
    - install-dependencies
