schemaVersion: 2.2.0
metadata:
  name: nodejs-hello-world
  version: 1.0.0

components:
  - name: runtime
    container: 
      image: registry.access.redhat.com/ubi9/nodejs-20:latest
      memoryLimit: 1G
      mountSources: true
      command: ['tail', '-f', '/dev/null']
      env:
        # Instructs the hidden IDE container to install the downloaded .vsix
        - name: DEFAULT_EXTENSIONS
          value: /projects/continue.vsix
      endpoints:
        - name: web
          targetPort: 8080
          exposure: public
          protocol: https
          secure: true 

commands:
  - id: download-continue
    exec:
      component: runtime
      commandLine: curl -sSL "https://open-vsx.org/api/Continue/continue/linux-x64/download" -o /projects/continue.vsix
      workingDir: ${PROJECTS_ROOT}

  - id: install-dependencies
    exec:
      component: runtime
      commandLine: npm install
      workingDir: ${PROJECTS_ROOT}/hello-world-node-js-code-assistant
      
  - id: start-app
    exec:
      component: runtime
      commandLine: npm start
      workingDir: ${PROJECTS_ROOT}/hello-world-node-js-code-assistant
      group:
        kind: run
        isDefault: true

events:
  postStart:
    # Ensure Continue is downloaded BEFORE the workspace fully boots
    - download-continue
    - install-dependencies
