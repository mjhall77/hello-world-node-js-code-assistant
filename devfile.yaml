schemaVersion: 2.2.0
metadata:
  name: nodejs-hello-world
  version: 1.0.0
components:
  - name: runtime
    type: container
    image: registry.access.redhat.com/ubi9/nodejs-20:latest
    memoryLimit: 1G
    mountSources: true
    command: ['tail', '-f', '/dev/null']
    endpoints:
      - name: web
        targetPort: 8080
        exposure: public
        protocol: http

commands:
  - id: install-dependencies
    exec:
      component: runtime
      commandLine: npm install
      workingDir: ${PROJECTS_ROOT}
      
  - id: start-app
    exec:
      component: runtime
      commandLine: npm start
      workingDir: ${PROJECTS_ROOT}
      group:
        kind: run
        isDefault: true

events:
  postStart:
    - install-dependencies
    - start-app
